<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIS-парсер — бібліографічні записи</title>
<script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
<style>
:root{font-family:system-ui,sans-serif;color:#183247;background:#f0f5f8}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:48px auto;padding:0 24px}header{margin-bottom:28px}.eyebrow{font-size:13px;letter-spacing:.12em;font-weight:700;color:#137467}h1{font-size:clamp(28px,5vw,42px);margin:12px 0}p{line-height:1.65;color:#496273}.card{background:#fff;border:1px solid #d8e2e9;border-radius:16px;padding:26px;margin:20px 0}label,h2{font-size:19px;font-weight:700}textarea{width:100%;min-height:270px;resize:vertical;margin:14px 0;padding:16px;border:1px solid #8ba1b2;border-radius:8px;font:14px/1.6 ui-monospace,monospace;color:#183247;background:#fbfdff}button{font:inherit;font-weight:600;padding:12px 18px;cursor:pointer;border-radius:8px;border:1px solid #a7bbc7;background:#fff;color:#183247}button.primary{background:#086d63;border-color:#086d63;color:#fff}button:disabled{opacity:.6;cursor:wait}.actions{display:flex;gap:10px;flex-wrap:wrap}:focus-visible{outline:3px solid #bc6c0e;outline-offset:3px}li{line-height:1.7;margin:12px 0;overflow-wrap:anywhere}#warnings{color:#765110}#warnings:empty{display:none}#status{font-weight:600}#output-text{padding-left:24px}.note{font-size:14px}footer{font-size:13px;color:#536c7a;margin:24px 0}h2{margin-top:0}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">ЛАБОРАТОРНА РОБОТА №14</div><h1>RIS → бібліографічний список</h1><p>Перетворення RIS-записів на бібліографічний список.</p></header>
<section class="card" aria-labelledby="input-label">
<label id="input-label" for="input-text">RIS-текст</label>
<textarea id="input-text" spellcheck="false" aria-describedby="input-help" placeholder="TY  - JOUR&#10;TI  - Назва статті&#10;ER  -"></textarea>
<div class="actions"><button class="primary" id="run" py-click="display_text">Перетворити</button><button type="button" id="example">Вставити приклад</button><button type="button" id="clear">Очистити</button></div>
<p id="input-help" class="note">Вставте RIS-текст і натисніть «Перетворити».</p>
</section>
<section class="card" aria-labelledby="result-title"><h2 id="result-title">Результат</h2><p id="status" role="status" aria-live="polite">Завантаження…</p><ol id="output-text"></ol><ul id="warnings" aria-label="Попередження"></ul><button type="button" id="copy" disabled>Копіювати список</button></section>

</main>
<script>
const example = `TY  - JOUR
AU  - Шевченко, Тарас
AU  - Smith, Jane Ann
TI  - Аналіз бібліографічних даних
JO  - Навчальний журнал
PY  - 2026
VL  - 4
IS  - 2
SP  - 10
EP  - 18
DO  - https://doi.org/10.1234/example
ER  -

TY  - BOOK
AU  - Коваленко, Олена
T1  - Основи програмування
PY  - 2025
PB  - Навчальне видавництво
CY  - Київ
ER  -`;
document.getElementById('example').addEventListener('click',()=>{document.getElementById('input-text').value=example;document.getElementById('input-text').focus();});
document.getElementById('clear').addEventListener('click',()=>{for(const id of ['output-text','warnings'])document.getElementById(id).replaceChildren();document.getElementById('input-text').value='';document.getElementById('status').textContent='Поле очищено. Вставте RIS-текст.';document.getElementById('copy').disabled=true;document.getElementById('input-text').focus();});
document.getElementById('copy').addEventListener('click',async()=>{const value=Array.from(document.querySelectorAll('#output-text li'),(item,i)=>`${i+1}. ${item.textContent}`).join('\n');try{await navigator.clipboard.writeText(value);document.getElementById('status').textContent='Список скопійовано.';}catch{document.getElementById('status').textContent='Браузер не дозволив копіювання. Виділіть результат і скопіюйте вручну.';}});
</script>
<script type="py">
import re

KNOWN = {'TY','T1','TI','JO','JF','JA','T2','AU','A1','PY','Y1','VL','IS','SP','EP','DO','PB','CY','UR','AB','N1','KW','SN','ID','ET','A2'}

def author_name(value):
    value = value.strip()
    if ',' not in value:
        return value
    surname, given = value.split(',', 1)
    initials = []
    for word in given.strip().split():
        letters = [part[0] + '.' for part in word.split('-') if part]
        if letters:
            initials.append('-'.join(letters))
    return ' '.join(part for part in [surname.strip(), ' '.join(initials)] if part)

def first(record, *tags):
    for tag in tags:
        for value in record.get(tag, []):
            if value.strip():
                return value.strip()
    return ''

def parse_ris(text):
    records, warnings = [], []
    current, last_tag = {}, None
    text = text.lstrip('\ufeff')
    if not text.strip():
        return [], ['Вставте RIS-текст перед перетворенням.']

    def finish(closed):
        nonlocal current, last_tag
        if current:
            records.append(current)
            if not closed:
                warnings.append('Запис %d: немає ER; запис завершено автоматично.' % len(records))
        current, last_tag = {}, None

    for number, line in enumerate(text.splitlines(), 1):
        if not line.strip():
            continue
        match = re.match(r'^([A-Za-z0-9]{2})\s*-\s?(.*)$', line)
        if match:
            tag, value = match.group(1).upper(), match.group(2).strip()
            if tag == 'ER':
                finish(True)
                continue
            if tag == 'TY':
                finish(False)
            if tag not in KNOWN:
                warnings.append('Рядок %d: невідомий тег %s пропущено.' % (number, tag))
                last_tag = None
                continue
            current.setdefault(tag, []).append(value)
            last_tag = tag
        elif line[:1].isspace() and current and last_tag:
            current[last_tag][-1] = (current[last_tag][-1] + ' ' + line.strip()).strip()
        else:
            warnings.append('Рядок %d: некоректний RIS-рядок пропущено.' % number)
            last_tag = None
    finish(False)
    if not records:
        warnings.append('RIS-записів не знайдено.')
    for index, record in enumerate(records, 1):
        if not first(record, 'TY'):
            warnings.append('Запис %d: не вказано тип TY.' % index)
        if not first(record, 'T1', 'TI'):
            warnings.append('Запис %d: немає назви T1/TI.' % index)
    return records, warnings

def citation(record):
    authors = record.get('AU') or record.get('A1', [])
    authors = ', '.join(filter(None, (author_name(a) for a in authors)))
    title = first(record, 'T1', 'TI') or '[Без назви]'
    venue = first(record, 'JO', 'JF', 'JA', 'T2')
    raw_year = first(record, 'PY', 'Y1')
    year_match = re.search(r'\b\d{4}\b', raw_year)
    year = year_match.group(0) if year_match else raw_year
    volume, issue = first(record, 'VL'), first(record, 'IS')
    start, end = first(record, 'SP'), first(record, 'EP')
    pages = start + ('–' + end if end and end != start else '') if start else end
    doi = re.sub(r'^(?:https?://(?:dx\.)?doi\.org/|doi\s*:\s*)', '', first(record, 'DO'), flags=re.I).strip()
    chunks = []
    if authors:
        chunks.append(authors)
    chunks.append(title)
    if venue:
        chunks.append(venue)
    publication = ': '.join(filter(None, [first(record, 'CY'), first(record, 'PB')]))
    if publication:
        chunks.append(publication)
    if year:
        chunks.append(year)
    if volume:
        chunks.append('Т. ' + volume)
    if issue:
        chunks.append('№ ' + issue)
    if pages:
        chunks.append('С. ' + pages)
    if doi:
        chunks.append('DOI: ' + doi)
    return '. '.join(chunk.rstrip('.') for chunk in chunks) + '.'

def convert(text):
    records, warnings = parse_ris(text)
    return [citation(record) for record in records], warnings

from pyscript import document

def display_text(*args):
    output = document.getElementById('output-text')
    warning_list = document.getElementById('warnings')
    output.replaceChildren()
    warning_list.replaceChildren()
    copy = document.getElementById('copy')
    copy.disabled = True
    results, warnings = convert(document.getElementById('input-text').value)
    for value in results:
        item = document.createElement('li')
        item.textContent = value
        output.appendChild(item)
    for warning in warnings:
        item = document.createElement('li')
        item.textContent = warning
        warning_list.appendChild(item)
    copy.disabled = not bool(results)
    document.getElementById('status').textContent = ('Оброблено записів: %d. Попереджень: %d.' % (len(results), len(warnings)))

document.getElementById('status').textContent = 'Готово до роботи.'
</script>
</body>
</html>
